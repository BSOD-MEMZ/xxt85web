<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xxtsoft · 文章</title>
    <link rel="icon" href="https://xxtsoft.top/images/icons/disconnected.ico" type="image/x-icon">
    <!-- 主题在 <link> 之前就定下来 —— 否则浏览器会先把默认主题 style.css 连它引用的
         图片一起下载一遍,再等 js/theme-loader.js 下载完才去改 href,于是打开页面会
         「无样式 → Aero → 新主题」闪三下。理由与替换方案见 AGENTS.md 坑 25。 -->
    <script>
        (function () {
            var css = 'style.css';
            try {
                var t = localStorage.getItem('theme') || '';
                if (/^[A-Za-z0-9._-]+\.css$/.test(t)) css = t;
            } catch (err) { /* 隐私模式读不到:按默认主题走 */ }
            /* 图标交接门(主题 CSS 第 14k 节 + AGENTS.md 坑 26):主题脚本是 defer 的、精灵表
               还要再下一个请求,在那之前浏览器已经把原始 PNG 画出来了 —— 所以先按主题 CSS 里
               那份名单把候选图标藏住,脚本换完自己摘掉这个类。
               顺手预加载精灵表:让它和主题脚本**并行**下载而不是排队等 ——
               省下的正好是这段"图标看不见"的时间。 */
            if (css === 'modern-sticker.css') {
                var de = document.documentElement;
                de.className = (de.className ? de.className + ' ' : '') + 'xxt-ic-pending';
                var pre = document.createElement('link');
                pre.rel = 'preload';
                pre.as = 'script';
                pre.href = 'js/modern-sticker-icons.js';
                (document.head || de).appendChild(pre);
                /* 兜底:主题脚本万一下载失败 / 卡住,图标不能永远藏着。
                   给 2s 是权衡:主题脚本 52KB + 精灵表 43KB(已预加载,并行),慢网可能要 1s 以上 ——
                   提前放行就等于白做(图标先以 PNG 出现、再被换成矢量,还是闪一下);
                   但也不能太久,万一脚本真挂了,图标得尽快回来。 */
                setTimeout(function () {
                    de.className = de.className.split('xxt-ic-pending').join(' ')
                        .replace(/\s{2,}/g, ' ').replace(/^\s+|\s+$/g, '');
                }, 2000);
            }
            document.write('<link rel="stylesheet" type="text/css" id="themeCss" href="' + css + '">');
        })();
    </script>
    <script src="js/theme-loader.js"></script>
    <script defer src="js/ripple.js"></script>
</head>
<body>
    <div class="titlebar">
        <div class="wrap">
            <h1>xxtsoft.top</h1>
        </div>
    </div>
    <div class="navbar">
        <div class="wrap">
            <ul>
                <li><a href="index.html">首页(H)</a></li>
                <li><a href="articles.html">文章(A)</a></li>
                <li><a href="downloads.html">下载(D)</a></li>
                <li><a href="medias.html">多媒体(M)</a></li>
                <li><a href="about.html">关于(A)</a></li>
            </ul>
        </div>
    </div>
    <p align="center"><span style="color: #003399;"><font size="48"><b>文章页面已迁移</b></font></span><p>
    <div style="text-align: center;">
        <img alt="下江小春举牌子" src="images/404.gif">
    </div>
    <p align="center"><font size="5">返回主页就能看到所有文章</font></p>
    <div style="text-align: center;">
        <img src="images/icons/dot.png" width="15" height="15"><a href="https://xxtsoft.top">返回主页</a>
    </div></body>
</html>

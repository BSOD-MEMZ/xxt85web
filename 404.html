<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xxtsoft · 404</title>
    <link rel="icon" href="https://xxtsoft.top/images/icons/disconnected.ico" type="image/x-icon">
    <!-- 主题在 <link> 之前就定下来 —— 否则浏览器会先把默认主题 style.css 连它引用的
         图片一起下载一遍,再等 js/theme-loader.js 下载完才去改 href,于是打开页面会
         「无样式 → Aero → 新主题」闪三下。理由与替换方案见 AGENTS.md 坑 25。 -->
    <script>
        (function () {
            var css = 'style.css';
            try {
                var t = localStorage.getItem('theme') || '';
                if (/^[A-Za-z0-9._-]+\.css$/.test(t)) css = t;
            } catch (err) { /* 隐私模式读不到:按默认主题走 */ }
            document.write('<link rel="stylesheet" type="text/css" id="themeCss" href="' + css + '">');
        })();
    </script>
    <script src="js/theme-loader.js"></script>
</head>
<body>
    <div class="titlebar">
        <div class="wrap">
            <h1>xxtsoft.top</h1>
        </div>
    </div>
    <div class="navbar">
        <div class="wrap">
            <ul>
                <li><a href="index.html">首页(H)</a></li>
                <li><a href="articles.html">文章(A)</a></li>
                <li><a href="downloads.html">下载(D)</a></li>
                <li><a href="medias.html">多媒体(M)</a></li>
                <li><a href="about.html">关于(A)</a></li>
            </ul>
        </div>
    </div>
    <p align="center"><span style="color: #003399;"><font size="48"><b>404 Not Found</b></font></span><p>
    <div style="text-align: center;">
        <img alt="下江小春举牌子" src="https://xxtsoft.top/images/404.gif">
    </div>
    <p align="center"><font size="5">你要找的网页不见啦！</font></p>
    <div style="text-align: center;">
        <img src="https://xxtsoft.top/images/icons/dot.png" width="15" height="15"><a href="https://xxtsoft.top">返回主页</a>
    </div>
</body>
</html>

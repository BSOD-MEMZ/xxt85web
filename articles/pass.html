<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>无题 ⭐ xxtsoft</title>
    <!-- 主题在 <link> 之前就定下来(同 AGENTS.md 坑 25):默认那套 style.css 与用户
         实际选的主题往往不是同一份,先把它的请求发出去 = 白下载一遍 + 闪三下。
         ⚠️ 下面那个映射要和 article-theme-loader.js 的 ARTICLE_THEME_MAP 一起改,
            加新主题时 test-round16.js 会比对两边。 -->
    <script>
        (function () {
            var css = 'style.css';
            try {
                if (localStorage.getItem('theme') === 'modern-sticker.css') {
                    css = 'modern-sticker-article.css';
                } else if ((localStorage.getItem('article_css') || 'default') === 'zuowen') {
                    css = 'zuowen-style.css';
                }
            } catch (err) { /* 隐私模式读不到:按默认走 */ }
            document.write('<link rel="stylesheet" href="' + css + '">');
        })();
    </script>
</head>
<body>
    <div class="header-image">
        <img src="vista.jpg" alt="标题图片">
        <div class="title-overlay">
            <h1>无题</h1>
        </div>
    </div>

    <div class="gradient-divider">
        <a href="javascript:window.close()" class="button"><img src="close.png" alt="" width="16" height="16" />
            关闭页面</a>
        <a href="../index.html" class="button"><img src="home.png" alt="" width="16" height="16" />
            回到首页</a>
        <a href="javascript:window.print()" class="button"><img src="printer.png" alt="" width="16" height="16" />
            打印文章</a>
    </div>

    <div class="content-container">
        <div class="author-info">
            <p>作者：xxt8582753</p>
            <p>发布日期：2025年7月8日</p>
        </div>

        <div class="article-content">
            <p>我被迫卷入这场战争，结束后早已伤痕累累</p>
            <h2>应试教育到底带给我们什么</h2>
            <p>我的梦想，被困在“上重点高中”的名枷利锁之间</p>
            <p>我的童真，被压在沉重的书包之下</p>
            <p>初中三年转瞬即逝，我却变化了不少，我不再做自己真正喜爱的事，而是为学习疲于奔命</p>
            <p>有句话我觉得说的很对：教育的本质是洗脑。事实上，我被迫接受那些“正确的”想法，并且也被迫适应了这两点一线的枯燥生活，也可以说，教育的本质是服从性测试</p>
            <p>原谅我语文不好，写的东西无法真正传达我的意思</p>
        </div>
    </div>
    <script src="image-viewer.js"></script>

<div class="giscus"></div>
<script src="../js/giscus-loader.js"></script>

    <script src="article-theme-loader.js"></script>
</body>
</html>

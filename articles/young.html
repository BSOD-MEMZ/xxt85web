<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青春 ⭐ xxtsoft</title>
    <script>
        (function () {
            var css = 'style.css';
            try {
                if (localStorage.getItem('theme') === 'modern-sticker.css') {
                    css = 'modern-sticker-article.css';
                } else if ((localStorage.getItem('article_css') || 'default') === 'zuowen') {
                    css = 'zuowen-style.css';
                }
            } catch (err) { }
            if (css === 'modern-sticker-article.css') {
                var de = document.documentElement;
                de.className = (de.className ? de.className + ' ' : '') + 'xxt-ic-pending';
                var pre = document.createElement('link');
                pre.rel = 'preload';
                pre.as = 'script';
                pre.href = '../js/modern-sticker-icons.js';
                (document.head || de).appendChild(pre);
                setTimeout(function () {
                    de.className = de.className.split('xxt-ic-pending').join(' ')
                        .replace(/\s{2,}/g, ' ').replace(/^\s+|\s+$/g, '');
                }, 2000);
            }
            document.write('<link rel="stylesheet" href="' + css + '">');
        })();
    </script>
</head>

<body>
    <div class="header-image">
        <img src="assets/mmjbg.jpg" alt="标题图片">
        <div class="title-overlay">
            <h1>青春</h1>
        </div>
    </div>
    <div class="gradient-divider">
        <a href="javascript:window.close()" class="button"><img src="close.png" alt="" width="16" height="16" />
            关闭页面</a>
        <a href="../index.html" class="button"><img src="home.png" alt="" width="16" height="16" />
            回到首页</a>
        <a href="javascript:window.print()" class="button"><img src="printer.png" alt="" width="16" height="16" />
            打印文章</a>
    </div>
    <div class="content-container">
        <div class="author-info">
            <p>作者：AbCd</p>
            <p>发布日期：2026年10月1日</p>
        </div>
        <div class="article-content">
            <p>「青春」</p>

            <p>什么是青春？我想——</p>

            <p>是灵光闪动的一个决定</p>
            <p>是打破常规的一种勇气</p>
            <p>是尝试新奇的自我探索</p>
            <p>是友人相伴的欢声笑语</p>
            <p>是激情，是活力四射</p>
            <p>是慌乱，是始料未及</p>
            <p>是跟一群朋友去疯疯癫癫</p>
            <p>是在一串行程中弯弯绕绕</p>

            <p>若按部就班，准时离开，这可能就是一个普通的国庆。但正是有了变数，一切变得丰富多彩、充满惊喜、令人期待</p>
        </div>
    </div>
    <script src="image-viewer.js"></script>

    <div class="giscus"></div>
    <script src="../js/giscus-loader.js"></script>

    <script src="article-theme-loader.js"></script>
</body>

</html>
